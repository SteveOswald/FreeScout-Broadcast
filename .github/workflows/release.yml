name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine new version
        id: version
        run: |
          CURRENT=$(node -p "require('./module.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT -> $NEW_VERSION ($( echo "${{ inputs.bump }}" ))"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update module.json version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('module.json', 'utf8'));
            data.version = '${{ steps.version.outputs.new }}';
            fs.writeFileSync('module.json', JSON.stringify(data, null, 4) + '\n');
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "chore: release v${{ steps.version.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Build module ZIP
        run: |
          mkdir -p /tmp/build/Broadcast
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='Tests' \
            ./ /tmp/build/Broadcast/
          cd /tmp/build
          zip -r "Broadcast-v${{ steps.version.outputs.new }}.zip" Broadcast
          mv "Broadcast-v${{ steps.version.outputs.new }}.zip" "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new }}"
          name: "v${{ steps.version.outputs.new }}"
          generate_release_notes: true
          files: "Broadcast-v${{ steps.version.outputs.new }}.zip"
